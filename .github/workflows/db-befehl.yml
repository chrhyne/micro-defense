# Führt einen einzelnen SQL-Befehl auf der Bestenliste aus (nur von Hand gestartet, z. B. zum Umbenennen).
name: Bestenliste ändern
on:
  workflow_dispatch:
    inputs:
      sql:
        description: 'SQL-Befehl'
        required: true
jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SQL: ${{ inputs.sql }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ausführen
        run: |
          npx --yes wrangler@3 d1 execute micro-defense --remote --json --command "$SQL" > out.json
          node -e 'const j=require("./out.json"); console.log("::notice title=Ergebnis::"+JSON.stringify(j[0].meta||j[0].results).slice(0,900))'
